<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101823">
  <title>Подложки карт · Gatefall</title>
  <link rel="stylesheet" href="./style.css?v=hounds-1">
  <link rel="stylesheet" href="./field.css?v=card-kind-2">
  <link rel="stylesheet" href="./live-badges-home.css?v=growth-vines-1">
  <link rel="stylesheet" href="./demo/badges-demo.css?v=hud-trial-1">
  <link rel="stylesheet" href="./economy.css?v=interface-polish-1">
  <link rel="stylesheet" href="./card-preview.css?v=preview-polish-1">
  <script type="module" src="./demo/badges-demo.js?v=hounds-1"></script>
</head>
<body>
  <main class="badges-demo">
    <header class="demo-header">
      <div>
        <p class="demo-brand">Gatefall</p>
        <h1>Подложки карт</h1>
      </div>
      <div class="demo-context">
        <label for="middle-context">Средний размер</label>
        <select id="middle-context">
          <option value="hand">Рука</option>
          <option value="catalog">Каталог</option>
        </select>
      </div>
    </header>
    <section class="demo-example" id="hud-trial" aria-labelledby="hud-trial-title">
      <header class="demo-example-header">
        <h2 id="hud-trial-title">Актуальные значки в игре</h2>
        <p>Карты в размере руки. Нажми на карту для крупного просмотра.</p>
      </header>
      <div class="demo-hud-hand"></div>
    </section>
    <section class="demo-legend" aria-label="Подложки и состояния"></section>
    <section class="demo-cards" aria-label="Сравнение на картах"></section>
  </main>
</body>
</html>
