<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181818">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gatefall — Угасшие врата</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=landscape">
  <link rel="stylesheet" href="./field.css?v=step-7">
  <script type="module" src="./app.js?v=step-7"></script>
</head>
<body>
  <div id="app">
    <header class="masthead">
      <div class="brand">
        <h1>Gatefall</h1>
        <p class="subtitle">Угасшие врата</p>
      </div>
      <div class="match-meta">
        <p id="phase"></p>
        <button id="start-settings" type="button" class="icon-button" aria-label="Настройки" title="Настройки">⚙</button>
      </div>
    </header>
    <main id="screen"></main>
    <p id="match-notice" class="field-message" role="status" hidden></p>
    <p id="announcement" class="visually-hidden" aria-live="polite"></p>
    <noscript>Для партии нужен JavaScript.</noscript>
  </div>
  <dialog id="settings" class="panel settings-dialog" aria-labelledby="settings-title">
    <div class="drawer-header">
      <h2 id="settings-title">Настройки</h2>
      <form method="dialog"><button type="submit" class="icon-button" aria-label="Закрыть" title="Закрыть">×</button></form>
    </div>
    <label class="motion-setting">
      <span>Анимации</span>
      <select id="animation-speed" aria-label="Скорость анимаций">
        <option value="system">По системе</option>
        <option value="normal">Обычная скорость</option>
        <option value="fast">Быстрая скорость</option>
      </select>
    </label>
    <button id="fullscreen" type="button" class="button">На весь экран</button>
    <p id="fullscreen-status" class="muted" role="status"></p>
  </dialog>
</body>
</html>
