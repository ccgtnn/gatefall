<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181818">
  <title>Gatefall — Угасшие врата</title>
  <link rel="stylesheet" href="./style.css?v=complete-art-5">
  <script type="module" src="./app.js?v=silhouettes-1"></script>
</head>
<body>
  <div id="app">
    <header class="masthead">
      <div class="brand">
        <h1>Gatefall</h1>
        <p class="subtitle">Угасшие врата</p>
      </div>
      <div class="match-meta">
        <p id="phase"></p>
        <label class="motion-setting">
          <span>Анимации</span>
          <select id="animation-speed">
            <option value="system">По системе</option>
            <option value="normal">Обычная скорость</option>
            <option value="fast">Быстрая скорость</option>
          </select>
        </label>
      </div>
    </header>
    <main id="screen"></main>
    <p id="announcement" class="visually-hidden" aria-live="polite"></p>
    <noscript>Для партии нужен JavaScript.</noscript>
  </div>
</body>
</html>
